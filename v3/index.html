<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hale · skate ski v3 prototype</title>
<style>
:root{--ink:#eaf2ff;--muted:#9fb2cc;--panel:rgba(10,16,30,.62);--line:rgba(160,190,255,.22);--accent:#ff7a3d;--cyan:#7fe6ff;--violet:#c9a2ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05070d;color:var(--ink);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.card{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#hud{top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;padding:10px 14px;max-width:min(330px,calc(100vw - 110px))}
#hud h1{margin:0;font-size:12px;letter-spacing:.32em;font-weight:700;color:var(--muted)}
#goal{margin:4px 0 6px;font-size:15px;font-weight:600}
#detail{font-size:12px;color:var(--muted);margin:-3px 0 7px;min-height:16px}
#offer,#hint{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%);padding:10px 18px;text-align:center;display:none;max-width:86vw}
#offer{cursor:pointer;border-color:var(--accent)} #offer b{display:block;font-size:17px} #offer span{display:block;font-size:12px;color:var(--muted)} #offer em{display:block;font-style:normal;font-size:10.5px;color:var(--accent);margin-top:3px;letter-spacing:.06em}
#hint{font-size:13px;color:var(--muted)}
@media (pointer:coarse){ #offer,#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 210px)} }
#pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);padding:2px 7px;border:1px solid var(--line);border-radius:99px}
.pip i{width:7px;height:7px;border-radius:50%;background:#3a4558}
.pip.on{color:var(--ink);border-color:var(--cyan)} .pip.on i{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.pip.here{border-color:var(--accent)}
#way{top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
#arrow{width:18px;height:18px;transition:transform .12s linear} #arrow path{fill:var(--accent)}
#speed{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);padding:6px 16px;text-align:center;min-width:150px}
#kmh{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1} #kmh small{font-size:11px;color:var(--muted);font-weight:500;margin-left:4px}
#where{font-size:11px;color:var(--muted);margin-top:2px;min-height:15px}
#btns{top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;display:flex;gap:8px;position:fixed}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--cyan)}
#fade{position:fixed;inset:0;background:#05060c;opacity:0;pointer-events:none;z-index:5}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);padding:10px 18px;font-size:16px;font-weight:600;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none;max-width:86vw}
#toast.on{opacity:1}
#help{bottom:14px;left:12px;padding:8px 12px;font-size:11.5px;color:var(--muted);max-width:300px}
#help b{color:var(--ink);font-weight:600}
#load,#end{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#1a1338,#05070d 70%);z-index:10;text-align:center;padding:24px}
#load h2,#end h2{margin:0;font-size:34px;letter-spacing:.4em;font-weight:300} #load p,#end p{margin:0;color:var(--muted);max-width:460px}
#end{display:none;background:rgba(8,6,22,.72);backdrop-filter:blur(3px)}
.pads{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:none;justify-content:space-between;padding:0 16px;pointer-events:none}
.pad{pointer-events:auto;width:min(34vw,170px);height:110px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none}
.pad.on{background:var(--accent);border-color:var(--accent)} .pad.pull{box-shadow:inset 0 0 0 3px var(--accent)}
@media (pointer:coarse){ .pads{display:flex} #help{display:none} #speed{bottom:calc(env(safe-area-inset-bottom,0px) + 136px)} }
body.clean .card,body.clean #btns{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="card"><h1>HALE</h1><div id="goal">&nbsp;</div><div id="detail"></div><div id="pips"></div></div>
<div id="way" class="card"><svg id="arrow" viewBox="0 0 20 20"><path d="M10 1l6 16-6-4-6 4z"/></svg><span id="wayTxt"></span></div>
<div id="btns"><button id="viewBtn" title="Planet view (V)">Planet</button><button id="resetBtn" title="Back to the last terminal you powered (R)">Reset</button></div>
<div id="speed" class="card"><div id="kmh">0<small>km/h</small></div><div id="where"></div></div>
<div id="help" class="card"><b>←/→</b> or <b>A/D</b> kick · hold to glide · <b>Space</b> + kick: loaded stroke · <b>↑</b> tuck (←/→ lean) · <b>↓</b> snow plow · <b>Enter</b> agree · <b>V</b> planet · <b>R</b> reset · <b>H</b> hide UI. Controller and touch as in the game.</div>
<div id="toast" class="card"></div>
<div id="offer" class="card"><b id="offerT"></b><span id="offerD"></span><em>Enter · E · Ⓐ · tap</em></div>
<div id="hint" class="card"></div>
<div class="pads" aria-hidden="true"><div class="pad" id="padL">Left kick</div><div class="pad" id="padR">Right kick</div></div>
<div id="end"><h2>HALE</h2><p id="endTxt"></p><div><button id="keepBtn">Keep skiing</button> <button id="newBtn">New game</button></div></div>
<div id="fade"></div>
<div id="load"><h2>HALE</h2><p id="loadTxt">Shaping the planet…</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/world.js"></script>
<script src="js/game-core.js"></script>
<script src="js/skier-anim.js"></script>
<script src="js/figure.js"></script>
<script src="js/skier.js"></script>
<script src="js/props.js"></script>
<script src="js/main.js"></script>
</body>
</html>
